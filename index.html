<!DOCTYPE html>

<html>
    <head>
        <title>Jeopardy</title>
        <link rel="stylesheet" href="style.css">
        
    </head>
    <body>
        <div class="header any">
            <div class="left top">
                <div>Students</div>
                <div class="lr">
                    <div class="updown">
                        <button class="smallb bl green" id="11">+</button>
                        <button class="smallb bl red" id="12">-</button>
                    </div>
                    <div class="big students">0</div>
                    
                </div>
            </div>
            <div class="top display main">
                <h1>Jeopardy</h1>
                <h2>Coding Edition</h2>
            </div>
            
            <div class="right top">
                <div>Parents</div>
                <div class="lr">
                    
                    <div class="big parents">0</div>
                    <div class="updown">
                        <button class="smallb br green" id="21">+</button>
                        <button class="smallb br red" id="22">-</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="cover any" inert></div>

        <div class="bar any">
            

        </div>
        <div class="grid any">
            
        </div>
        <div class="assets">
            <audio src="/assets/audio/Low Whoosh.wav" id="whoosh" type="audio/wav" preload="auto"></audio>
            <audio src="/assets/audio/High Whoosh.wav" id="whoosh2" type="audio/wav" preload="auto"></audio>

            <audio src="/assets/audio/Magic Spell.wav" id="magic" type="audio/wav" preload="auto"></audio>
            <audio src="/assets/audio/Bonk.wav" id="bonk" type="audio/wav" preload="auto"></audio>

            <audio src="/assets/audio/Bell Toll.wav" id="bell" type="audio/wav" preload="auto"></audio>
        </div>

        <script src="main.js"></script>
    </body>
</html>
